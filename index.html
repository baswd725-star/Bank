<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات بنك الخرطوم أونلاين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', Tahoma, sans-serif, Arial;
        }

        body {
            background-color: #f7f9fa;
            color: #333;
            text-align: center;
        }

        /* الهيدر أو القسم العلوي باللون الأحمر */
        .header-section {
            background-color: #e31b23; /* لون بنك الخرطوم الأحمر */
            color: #ffffff;
            padding: 30px 20px 40px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* تنسيق الشعار واللوجو */
        .bank-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #7ac143 0%, #006837 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
        }

        /* محاكاة الأيقونة الخضراء للبنك */
        .logo-icon::before {
            content: "«";
            color: #ffde17;
            font-size: 32px;
            font-weight: bold;
        }

        .bank-name-text {
            text-align: right;
        }

        .bank-name-ar {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .bank-name-en {
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .bank-slogan {
            font-size: 11px;
            border-top: 1px solid rgba(255,255,255,0.4);
            margin-top: 3px;
            padding-top: 2px;
            color: #ffde17;
        }

        /* زر خدمات بنكك أونلاين الأصفر */
        .services-badge {
            display: inline-block;
            background-color: #ffc107; /* اللون الأصفر الواضح في الصورة */
            color: #1a1a1a;
            font-size: 20px;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-top: 10px;
        }

        /* القسم السفلي الأبيض */
        .content-section {
            background-color: #ffffff;
            padding: 40px 20px;
            min-height: 250px;
        }

        .welcome-title {
            color: #e31b23;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .welcome-subtitle {
            color: #e31b23;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .instruction-text {
            color: #555555;
            font-size: 16px;
            font-weight: 500;
        }

        /* تنسيق أيقونة الواتساب الصغيرة والمثبتة */
        .whatsapp-float {
            position: fixed;
            bottom: 15px;
            left: 15px;
            width: 38px;
            height: 38px;
            z-index: 9999;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.3);
        }

        .whatsapp-float img {
            width: 22px;
            height: 22px;
        }
    </style>
</head>
<body>

    <!-- الجزء العلوي الأحمر والشعار -->
    <div class="header-section">
        <div class="bank-logo-container">
            <div class="logo-icon"></div>
            <div class="bank-name-text">
                <div class="bank-name-ar">بنك الخرطوم</div>
                <div class="bank-name-en">Bank of Khartoum</div>
                <div class="bank-slogan">— أنت أولاً —</div>
            </div>
        </div>

        <div class="services-badge">
            خدمات بنكك أونلاين
        </div>
    </div>

    <!-- الجزء السفلي والترحيب -->
    <div class="content-section">
        <h1 class="welcome-title">مرحباً بكم في خدمات بنكك أونلاين Bankak</h1>
        <h2 class="welcome-subtitle">Online</h2>
        <p class="instruction-text">الرجاء الاختيار من الخدمات المقدمة أدناه</p>
    </div>

    <!-- زر الواتساب المصغر -->
    <a href="https://wa.me/249998924425" target="_blank" class="whatsapp-float">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>

</body>
</html>
